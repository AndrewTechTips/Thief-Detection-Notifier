name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch makes the running workflow obsolete.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  UV_VERSION: "0.12.22"

jobs:
  quality:
    name: Lint, types & tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: vision_hub_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Check lockfile is up to date
        run: uv lock --check

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint
        run: uv run --frozen ruff check --output-format=github

      - name: Format
        run: uv run --frozen ruff format --check

      - name: Type check
        run: uv run --frozen mypy

      # The person-detection tests need the model (36 MB); it never changes for a pinned hash.
      - name: Cache the person model
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: data/models
          key: person-model-${{ hashFiles('src/vision_hub/vision/persons.py') }}

      - name: Download the person model (verified by SHA-256)
        run: uv run --frozen vision-hub download-model

      - name: Test (SQLite and PostgreSQL)
        run: uv run --frozen pytest --cov-report=term-missing --cov-report=xml
        env:
          VISION_HUB_TEST_POSTGRES_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/vision_hub_test

  frontend:
    name: Dashboard
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format
        run: npm run format:check

      - name: Type check
        run: npm run typecheck

      # openapi.json itself is checked against the backend by the Python test suite.
      - name: API types match openapi.json
        run: npm run api:check

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The tests start a real hub (e2e/start-hub.sh), so the Python environment is needed too.
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Install the hub
        working-directory: .
        run: uv sync --frozen

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies and Chromium
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Build the dashboard
        run: npm run build

      - name: Run end-to-end tests (desktop and phone)
        run: npm run e2e

      - name: Upload the report on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: frontend/test-results/
          retention-days: 7

  docker:
    name: Docker image & compose stack
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: quality
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build and start (hub + PostgreSQL)
        run: docker compose up --build --detach --wait --wait-timeout 120

      - name: Smoke test (readiness includes the database)
        run: |
          curl --fail --silent --show-error http://localhost:8000/api/v1/health/ready | tee ready.json
          grep -q '"name":"database","healthy":true' ready.json

      - name: Serves the dashboard (app shell with its CSP, compressed hashed assets)
        run: |
          curl --fail --silent --show-error --dump-header page.txt http://localhost:8000/events | grep -q '<title>Vision Hub</title>'
          grep -qi "^content-security-policy: default-src 'self'" page.txt
          asset=$(curl --fail --silent http://localhost:8000/ | grep -oE '/assets/index-[^"]+\.js' | head -1)
          curl --fail --silent --show-error --dump-header asset.txt --output /dev/null -H 'Accept-Encoding: br' "http://localhost:8000$asset"
          grep -qi '^content-encoding: br' asset.txt
          grep -qi '^cache-control: public, max-age=31536000, immutable' asset.txt

      - name: Runs as non-root
        run: test "$(docker compose exec -T api id -u)" != "0"

      - name: Logs on failure
        if: failure()
        run: docker compose logs

      - name: Tear down
        if: always()
        run: docker compose down --volumes
