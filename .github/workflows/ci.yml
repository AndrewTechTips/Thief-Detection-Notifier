name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch makes the running workflow obsolete.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  UV_VERSION: "0.12.22"

jobs:
  quality:
    name: Lint, types & tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: vision_hub_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Check lockfile is up to date
        run: uv lock --check

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint
        run: uv run --frozen ruff check --output-format=github

      - name: Format
        run: uv run --frozen ruff format --check

      - name: Type check
        run: uv run --frozen mypy

      - name: Test (SQLite and PostgreSQL)
        run: uv run --frozen pytest --cov-report=term-missing --cov-report=xml
        env:
          VISION_HUB_TEST_POSTGRES_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/vision_hub_test

  docker:
    name: Docker image & compose stack
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: quality
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build and start (hub + PostgreSQL)
        run: docker compose up --build --detach --wait --wait-timeout 120

      - name: Smoke test (readiness includes the database)
        run: |
          curl --fail --silent --show-error http://localhost:8000/api/v1/health/ready | tee ready.json
          grep -q '"name":"database","healthy":true' ready.json

      - name: Runs as non-root
        run: test "$(docker compose exec -T api id -u)" != "0"

      - name: Logs on failure
        if: failure()
        run: docker compose logs

      - name: Tear down
        if: always()
        run: docker compose down --volumes
