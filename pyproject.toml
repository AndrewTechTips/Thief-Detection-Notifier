[project]
name = "vision-hub"
version = "0.1.0"
description = "Asynchronous IoT Vision Hub: real-time motion detection, alerts and live camera streams over FastAPI."
authors = [
    { name = "AndrewTechTips", email = "andreww.steel69@gmail.com" }
]
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.142.2",
    "pydantic[email]>=2.13.5",
    "pydantic-settings>=2.15.0",
    "structlog>=26.1.0",
    "uvicorn[standard]>=0.54.0",
    "pwdlib[argon2]>=0.3.1",
    "pyjwt>=2.15.1",
    "python-multipart>=0.0.32",
    "limits>=5.8.0",
    "opencv-python-headless>=5.0.0.93",
    "numpy>=2.5.3",
    "aiosmtplib>=5.1.3",
    "sqlalchemy[asyncio]>=2.1.3",
    "asyncpg>=0.31.0",
    "alembic>=1.20.0",
    "cryptography>=50.0.2",
    "prometheus-client>=0.26.0",
]

[project.scripts]
vision-hub = "vision_hub.__main__:main"

[build-system]
requires = ["uv_build>=0.12.22,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "aiosqlite>=0.22.1",
    "asgi-lifespan>=2.1.0",
    "httpx2>=2.13.1",
    "mypy>=2.4.0",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.10",
]

# ── Ruff ────────────────────────────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "N",        # pep8-naming
    "UP",       # pyupgrade
    "B",        # flake8-bugbear
    "A",        # flake8-builtins
    "C4",       # flake8-comprehensions
    "SIM",      # flake8-simplify
    "S",        # flake8-bandit (security)
    "ASYNC",    # flake8-async (blocking calls in async code)
    "PT",       # flake8-pytest-style
    "RET",      # flake8-return
    "PTH",      # prefer pathlib
    "T20",      # no print()
    "FAST",     # FastAPI-specific rules
    "RUF",      # ruff-specific
]

[tool.ruff.lint.per-file-ignores]
"benchmarks/**" = ["T201"]  # reports are printed
"tests/**" = [
    "S101", "S105", "S106", "S107", "S311",  # asserts, fake credentials, seeded randomness
    "ASYNC110",  # polling a condition with sleep is fine in tests
    "ASYNC240",  # inspecting files from async tests is fine
]

[tool.ruff.lint.flake8-bugbear]
# FastAPI dependency markers are safe as default arguments
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path", "fastapi.Header"]

[tool.ruff.format]
docstring-code-format = true

# ── Mypy ────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.14"
strict = true
files = ["src", "tests", "benchmarks"]
plugins = ["pydantic.mypy"]
warn_unreachable = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# ── Pytest / Coverage ───────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--import-mode=importlib",
    "--cov=vision_hub",
    "--cov-report=term-missing",
]
filterwarnings = ["error"]

[tool.coverage.run]
branch = true
source = ["vision_hub"]
# Alembic executes migration scripts from file paths, so coverage cannot attribute them;
# tests/integration/db/test_migrations.py exercises them (upgrade, downgrade, drift).
omit = ["*/infra/db/migrations/*"]

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError", "@overload", "if __name__ == .__main__.:"]
