<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#05080f" />
    <meta
      name="description"
      content="Live cameras, motion alerts and event history for your Vision Hub."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="Vision Hub" />
    <!-- The top bar pads for the status bar itself (safe-area insets). -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Vision Hub</title>
  </head>
  <body class="min-h-dvh">
    <div class="ambient" aria-hidden="true"></div>

    <div id="app">
      <!-- Shown only when the hub is slow or unreachable (see main.js). -->
      <div
        class="boot-screen grid min-h-dvh place-items-center px-4 py-[max(1.5rem,env(safe-area-inset-top))]"
        data-boot-screen
        data-pending
      >
        <section
          class="panel boot lens-host w-full max-w-sm px-6 pt-10 pb-7 text-center sm:px-8"
          data-boot
          data-state="checking"
          aria-labelledby="boot-title"
        >
          <div class="lens mx-auto" aria-hidden="true">
            <span class="lens-glow"></span>
            <span class="lens-iris"></span>
            <span class="lens-ripple"></span>
          </div>

          <h1 id="boot-title" class="mt-7 text-2xl font-semibold tracking-tight">Vision Hub</h1>

          <div class="mt-5 min-h-[4.75rem]" role="status" aria-live="polite" data-slot="report">
            <p class="font-medium" data-slot="title">Connecting to your hub</p>
            <p class="mt-1 text-sm text-pretty text-haze">
              <span data-slot="detail">This takes a second.</span>
              <code class="code-chip" data-slot="command" hidden></code>
            </p>
          </div>

          <div class="mt-4 flex h-9 items-center justify-center gap-3" data-slot="retry" hidden>
            <span class="text-sm text-haze tabular-nums" data-slot="countdown"></span>
            <button type="button" class="btn btn-secondary btn-sm" data-action="retry">
              Retry now
            </button>
          </div>
        </section>
      </div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
